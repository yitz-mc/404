<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page Not Found</title>
    <link rel="stylesheet" href="./style.css" />
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Determine theme from URL (?theme=light or ?theme=dark), default to light
        const params = new URLSearchParams(window.location.search);
        const theme = params.get("theme") === "dark" ? "dark-theme" : "light-theme";
        document.body.classList.add(theme);

        const triggerLogout = document.getElementById("go-home");
        triggerLogout.addEventListener("click", (event) => {
          // Send a message to the parent window to trigger logout
          window.parent.postMessage("go-home", "*");
        });
      });
    </script>
  </head>
  <body>
    <div class="error-container">
      <div class="error-number">
        <span>4</span>
        <span>0</span>
        <span>4</span>
      </div>
      <div class="message">
        <h1>Oops! Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved.</p>
      </div>
      <div class="outlined-button" id="go-home">Return to Homepage</div>
    </div>
  </body>
</html>
